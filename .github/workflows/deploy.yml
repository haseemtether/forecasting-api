name: Deploy Services

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Enter services to deploy (comma-separated, e.g., notification,prediction,dataprocessing,ingestion)"
        required: true
        default: "all"

jobs:
  container-scanning:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set Short SHA
        id: set-short-sha
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
      
      - name: Log in to Azure Container Registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ vars.ACR_URL }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
  
      - name: Determine which services to deploy
        id: set-services
        run: |
          if [[ "${{ github.event.inputs.services }}" == "all" ]]; then
            echo "DEPLOY_ALL=true" >> $GITHUB_ENV
          else
            echo "DEPLOY_ALL=false" >> $GITHUB_ENV
            echo "DEPLOY_SERVICES=$(echo '${{ github.event.inputs.services }}' | tr ',' ' ')" >> $GITHUB_ENV
          fi
  
      - name: Debug Inputs
        run: |
          echo "DEPLOY_ALL=$DEPLOY_ALL"
          echo "DEPLOY_SERVICES=$DEPLOY_SERVICES"

      - name: Scan Notification Service
        if: env.DEPLOY_ALL == 'true' || contains(env.DEPLOY_SERVICES, 'notification')
        run: |
          docker build -t notification-scan:$SHORT_SHA -f backend/notification/Dockerfile backend/notification
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $PWD:/app aquasec/trivy image --severity CRITICAL,HIGH --exit-code 1 --format json -o /app/trivy-notification.json notification-scan:$SHORT_SHA

      - name: Scan Prediction Service
        if: env.DEPLOY_ALL == 'true' || contains(env.DEPLOY_SERVICES, 'prediction')
        run: |
          docker build -t prediction-scan:$SHORT_SHA -f backend/prediction/Dockerfile backend/prediction
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $PWD:/app aquasec/trivy image --severity CRITICAL,HIGH --exit-code 1 --format json -o /app/trivy-prediction.json prediction-scan:$SHORT_SHA

      - name: Scan DataProcessing Service
        if: env.DEPLOY_ALL == 'true' || contains(env.DEPLOY_SERVICES, 'dataprocessing')
        run: |
          docker build -t dataprocessing-scan:$SHORT_SHA -f backend/data-processing/Dockerfile backend/data-processing
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $PWD:/app aquasec/trivy image --severity CRITICAL,HIGH --exit-code 1 --format json -o /app/trivy-dataprocessing.json dataprocessing-scan:$SHORT_SHA

      - name: Scan Ingestion Service
        if: env.DEPLOY_ALL == 'true' || contains(env.DEPLOY_SERVICES, 'ingestion')
        run: |
          docker build -t ingestion-scan:$SHORT_SHA -f backend/ingestion/Dockerfile backend/ingestion
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $PWD:/app aquasec/trivy image --severity CRITICAL,HIGH --exit-code 1 --format json -o /app/trivy-ingestion.json ingestion-scan:$SHORT_SHA

      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-*.json

  build-and-deploy:
    needs: container-scanning
    runs-on: self-hosted
    if: success()  # Only runs if scanning job succeeds
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh

      - name: Log in to Azure Container Registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ vars.ACR_URL }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Deploy Notification Service
        if: env.DEPLOY_ALL == 'true' || contains(env.DEPLOY_SERVICES, 'notification')
        run: |
          docker build -t ${{ vars.ACR_URL }}/notification:$SHORT_SHA -f backend/notification/Dockerfile backend/notification
          docker push ${{ vars.ACR_URL }}/notification:$SHORT_SHA
          helm upgrade --install notification deployments/notification-chart --set image.repository=${{ vars.ACR_URL }}/notification --set image.tag=$SHORT_SHA --namespace backend

      - name: Deploy Prediction Service
        if: env.DEPLOY_ALL == 'true' || contains(env.DEPLOY_SERVICES, 'prediction')
        run: |
          docker build -t ${{ vars.ACR_URL }}/prediction:$SHORT_SHA -f backend/prediction/Dockerfile backend/prediction
          docker push ${{ vars.ACR_URL }}/prediction:$SHORT_SHA
          helm upgrade --install prediction deployments/prediction-chart --set image.repository=${{ vars.ACR_URL }}/prediction --set image.tag=$SHORT_SHA --namespace backend

      - name: Deploy DataProcessing Service
        if: env.DEPLOY_ALL == 'true' || contains(env.DEPLOY_SERVICES, 'dataprocessing')
        run: |
          docker build -t ${{ vars.ACR_URL }}/dataprocessing:$SHORT_SHA -f backend/data-processing/Dockerfile backend/data-processing
          docker push ${{ vars.ACR_URL }}/dataprocessing:$SHORT_SHA
          helm upgrade --install dataprocessing deployments/dataprocessing-chart --set image.repository=${{ vars.ACR_URL }}/dataprocessing --set image.tag=$SHORT_SHA --namespace backend

      - name: Deploy Ingestion Service
        if: env.DEPLOY_ALL == 'true' || contains(env.DEPLOY_SERVICES, 'ingestion')
        run: |
          docker build -t ${{ vars.ACR_URL }}/ingestion:$SHORT_SHA -f backend/ingestion/Dockerfile backend/ingestion
          docker push ${{ vars.ACR_URL }}/ingestion:$SHORT_SHA
          helm upgrade --install ingestion deployments/ingestion-chart --set image.repository=${{ vars.ACR_URL }}/ingestion --set image.tag=$SHORT_SHA --namespace backend
