name: Deploy Services

on:
  push:
    branches:
      - develop  # Auto deploy when code is pushed to develop
  workflow_dispatch:  # Manually trigger workflow with selected services
    inputs:
      services:
        description: "Enter services to deploy (comma-separated, e.g., notification,prediction)"
        required: true
        default: "all"

jobs:
  build-and-deploy:
    runs-on: self-hosted  # Use GitHub runner installed on your server

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ vars.ACR_URL }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Determine which services to deploy
        id: set-services
        run: |
          INPUT_SERVICES="${{ github.event.inputs.services }}"
          if [[ "$INPUT_SERVICES" == "all" ]]; then
            echo "DEPLOY_ALL=true" >> $GITHUB_ENV
          else
            echo "DEPLOY_ALL=false" >> $GITHUB_ENV
            echo "DEPLOY_SERVICES=$INPUT_SERVICES" >> $GITHUB_ENV
          fi

      - name: Deploy Notification Service
        if: env.DEPLOY_ALL == 'true' || contains(env.DEPLOY_SERVICES, 'notification')
        run: |
          docker build -t ${{ vars.ACR_URL }}/notification:latest -f notification/Dockerfile notification
          docker push ${{ vars.ACR_URL }}/notification:latest
          helm upgrade --install notification deployment/notification-chart --set image.repository=${{ vars.ACR_URL }}/notification

      - name: Deploy Prediction Service
        if: env.DEPLOY_ALL == 'true' || contains(env.DEPLOY_SERVICES, 'prediction')
        run: |
          docker build -t ${{ vars.ACR_URL }}/prediction:latest -f prediction/Dockerfile prediction
          docker push ${{ vars.ACR_URL }}/prediction:latest
          helm upgrade --install prediction deployment/prediction-chart --set image.repository=${{ vars.ACR_URL }}/prediction

      - name: Deploy Ingestion Service
        if: env.DEPLOY_ALL == 'true' || contains(env.DEPLOY_SERVICES, 'ingestion')
        run: |
          docker build -t ${{ vars.ACR_URL }}/ingestion:latest -f ingestion/Dockerfile ingestion
          docker push ${{ vars.ACR_URL }}/ingestion:latest
          helm upgrade --install ingestion deployment/ingestion-chart --set image.repository=${{ vars.ACR_URL }}/ingestion

      - name: Deploy Processing Service
        if: env.DEPLOY_ALL == 'true' || contains(env.DEPLOY_SERVICES, 'dataprocessing')
        run: |
          docker build -t ${{ vars.ACR_URL }}/dataprocessing:latest -f data-processing/Dockerfile dataprocessing
          docker push ${{ vars.ACR_URL }}/dataprocessing:latest
          helm upgrade --install dataprocessing deployment/dataprocessing-chart --set image.repository=${{ vars.ACR_URL }}/dataprocessing
