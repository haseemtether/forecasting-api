name: Deploy Services

on:
  workflow_dispatch:  # Manually trigger workflow with selected services
    inputs:
      services:
        description: "Enter services to deploy (comma-separated, e.g., notification,prediction)"
        required: true
        default: "all"
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh

      - name: Log in to Azure Container Registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ vars.ACR_URL }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Determine which services to deploy
        id: set-services
        run: |
          if [[ "${{ github.event.inputs.services }}" == "all" ]]; then
            echo "DEPLOY_ALL=true" >> $GITHUB_ENV
          else
            echo "DEPLOY_ALL=false" >> $GITHUB_ENV
            echo "DEPLOY_SERVICES=$(echo '${{ github.event.inputs.services }}' | tr ',' ' ')" >> $GITHUB_ENV
          fi

      - name: Debug Inputs
        run: |
          echo "DEPLOY_ALL=$DEPLOY_ALL"
          echo "DEPLOY_SERVICES=$DEPLOY_SERVICES"

      - name: Deploy Notification Service
        if: env.DEPLOY_ALL == 'true' || contains(env.DEPLOY_SERVICES, 'notification')
        run: |
          docker build -t ${{ vars.ACR_URL }}/notification:latest -f backend/notification/Dockerfile backend/notification
          docker push ${{ vars.ACR_URL }}/notification:latest
          helm upgrade --install notification deployment/notification-chart --set image.repository=${{ vars.ACR_URL }}/notification --namespace backend

      - name: Deploy Prediction Service
        if: env.DEPLOY_ALL == 'true' || contains(env.DEPLOY_SERVICES, 'prediction')
        run: |
          docker build -t ${{ vars.ACR_URL }}/prediction:latest -f backend/prediction/Dockerfile backend/prediction
          docker push ${{ vars.ACR_URL }}/prediction:latest
          helm upgrade --install prediction deployment/prediction-chart --set image.repository=${{ vars.ACR_URL }}/prediction --namespace backend