image:
  repository: githubrunnertestregistry.azurecr.io/dataprocessing
  tag: "v2"
  pullPolicy: IfNotPresent
namespace: backend
replicaCount: 2

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "250m"
    memory: "256Mi"

imagePullSecrets:
  - name: docker-registry-credentials


ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: data-processing.duckdns.org
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: dataprocessing-tls-secret
      hosts:
        - data-processing.duckdns.org